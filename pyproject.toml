[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-safety-claims-workbench"
version = "0.1.0"
description = "Runnable evaluations and scaffolds that export sketches and attempts to the ai-safety-claims registry."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["inspect_ai>=0.3.200", "PyYAML>=6.0", "jsonschema>=4.20"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
workbench = "workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
